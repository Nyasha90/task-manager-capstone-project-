{% extends "base.html" %}
{% block content %}
<form method="post" class="card p-3 mb-4">
  <div class="row g-2">
    <div class="col-12 col-md-4"><input class="form-control" name="title" placeholder="Title" required></div>
    <div class="col-12 col-md-4"><input class="form-control" name="description" placeholder="Description"></div>
    <div class="col-6 col-md-2"><input class="form-control" type="date" name="due_date"></div>
    <div class="col-6 col-md-2"><button class="btn btn-success w-100">Add</button></div>
  </div>
</form>
{% for t in tasks %}
<div class="card p-3 mb-2 d-flex flex-row justify-content-between align-items-center">
  <div>
    <strong class="{{ 'text-decoration-line-through' if t.status == 'done' }}">{{ t.title }}</strong>
    <span class="badge bg-secondary">{{ t.status }}</span>
    {% if t.due_date %}<small class="text-muted">due {{ t.due_date }}</small>{% endif %}
    <div class="text-muted small">{{ t.description }}</div>
  </div>
  <div class="d-flex gap-1">
    <form method="post" action="{{ url_for('main.toggle_task', task_id=t.id) }}"><button class="btn btn-sm btn-outline-primary">Done/Undo</button></form>
    <form method="post" action="{{ url_for('main.delete_task_web', task_id=t.id) }}"><button class="btn btn-sm btn-outline-danger">Delete</button></form>
  </div>
</div>
{% else %}<p class="text-muted">No tasks yet.</p>{% endfor %}
{% endblock %}
