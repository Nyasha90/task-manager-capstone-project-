{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center py-4">
  <div class="glass-card p-4 p-md-5 w-100 shadow-lg" style="max-width: 440px;">
    <!-- Brand Header -->
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center rounded-4 mb-3 p-3" style="background: var(--accent-gradient); width: 64px; height: 64px; box-shadow: var(--accent-glow);">
        <i class="bi bi-person-plus-fill text-white fs-2"></i>
      </div>
      <h3 class="fw-bold mb-1">Create Account</h3>
      <p class="text-muted small">Join TaskMaster & get instant pre-populated sample tasks</p>
    </div>

    <!-- Registration Form -->
    <form method="post" action="{{ url_for('main.register') }}">
      <div class="mb-3">
        <label class="form-label small fw-semibold text-muted">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-secondary text-secondary"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control bg-transparent border-secondary" name="username" placeholder="Choose a username" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-semibold text-muted">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-secondary text-secondary"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control bg-transparent border-secondary" name="password" placeholder="Min 6 characters" required minlength="6">
        </div>
      </div>

      <button type="submit" class="btn btn-gradient w-100 py-2 rounded-3 mb-3">
        Create Account & Load Dataset <i class="bi bi-arrow-right ms-1"></i>
      </button>
    </form>

    <p class="text-center mt-3 mb-0 small text-muted">
      Already have an account? <a href="{{ url_for('main.login') }}" class="text-indigo fw-bold text-decoration-none">Sign In</a>
    </p>
  </div>
</div>
{% endblock %}
